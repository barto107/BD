<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Collection de BD</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        h1 { text-align: center; }
        .search-container, .admin-container { text-align: center; margin-bottom: 25px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px; margin-left: auto; margin-right: auto; }
        input { padding: 8px; width: 250px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; margin: 5px; }
        button { padding: 8px 15px; font-size: 14px; cursor: pointer; border: none; border-radius: 4px; background-color: #007bff; color: white; margin: 5px; }
        button#reset-btn { background-color: #6c757d; }
        button#export-btn { background-color: #28a745; }
        button.delete-serie-btn { background-color: #dc3545; padding: 4px 8px; font-size: 12px; float: right; margin-left: 5px; }
        button.edit-serie-btn { background-color: #ffc107; color: black; padding: 4px 8px; font-size: 12px; float: right; }
        .serie-container { margin-bottom: 30px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .serie-content { display: flex; gap: 20px; margin-top: 15px; align-items: flex-start; }
        .serie-img { width: 150px; height: 200px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; background: #fafafa; }
        .serie-info { flex-grow: 1; }
        .serie-resume { font-style: italic; color: #555; font-size: 14px; }
    </style>
</head>
<body>

    <h1>Ma Collection de Bandes Dessinées</h1>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Rechercher une série...">
        <button id="search-btn">Rechercher</button>
        <button id="reset-btn">Réinitialiser</button>
    </div>

    <div class="admin-container">
        <h3>Gestion des Séries</h3>
        <input type="text" id="new-serie-input" placeholder="Nom de la série">
        <input type="text" id="new-pochette-input" placeholder="URL de la pochette">
        <input type="text" id="new-resume-input" placeholder="Résumé de la série">
        <br>
        <button id="add-serie-btn">Ajouter la série</button>
        <button id="export-btn">Exporter collection.json</button>
    </div>

    <div id="collection-container">Chargement de la collection...</div>

    <script>
        let globalData = null;

        function displayCollection(data) {
            const container = document.getElementById('collection-container');
            container.innerHTML = '';

            if (!data.series || data.series.length === 0) {
                container.innerHTML = '<p style="text-align:center;">Aucune bande dessinée trouvée.</p>';
                return;
            }

            data.series.forEach((serie) => {
                let serieDiv = document.createElement('div');
                serieDiv.className = 'serie-container';
                
                let serieTitle = document.createElement('h2');
                serieTitle.textContent = serie.nomSerie;

                let deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-serie-btn';
                deleteBtn.textContent = 'Supprimer';
                deleteBtn.onclick = () => deleteSerie(serie.nomSerie);

                let editBtn = document.createElement('button');
                editBtn.className = 'edit-serie-btn';
                editBtn.textContent = 'Modifier';
                editBtn.onclick = () => editSerie(serie.nomSerie);
                
                serieTitle.appendChild(deleteBtn);
                serieTitle.appendChild(editBtn);
                serieDiv.appendChild(serieTitle);

                let contentDiv = document.createElement('div');
                contentDiv.className = 'serie-content';

                let img = document.createElement('img');
                img.className = 'serie-img';
                img.src = serie.pochette || '';
                img.alt = serie.nomSerie;
                contentDiv.appendChild(img);

                let infoDiv = document.createElement('div');
                infoDiv.className = 'serie-info';
                let resumeP = document.createElement('p');
                resumeP.className = 'serie-resume';
                resumeP.textContent = serie.resumeSerie || 'Aucun résumé.';
                infoDiv.appendChild(resumeP);

                contentDiv.appendChild(infoDiv);
                serieDiv.appendChild(contentDiv);
                container.appendChild(serieDiv);
            });
        }

        function deleteSerie(nomSerie) {
            if (confirm(`Voulez-vous vraiment supprimer la série "${nomSerie}" ?`)) {
                globalData.series = globalData.series.filter(s => s.nomSerie !== nomSerie);
                displayCollection(globalData);
            }
        }

        function editSerie(nomSerie) {
            const serie = globalData.series.find(s => s.nomSerie === nomSerie);
            if (!serie) return;

            const nouveauNom = prompt(`Modifier le nom de la série :`, serie.nomSerie);
            if (nouveauNom === null) return;

            const nouvellePochette = prompt(`Modifier l'URL de la pochette :`, serie.pochette || '');
            if (nouvellePochette === null) return;

            const nouveauResume = prompt(`Modifier le résumé de la série :`, serie.resumeSerie || '');
            if (nouveauResume === null) return;

            if (nouveauNom.trim() !== '') {
                serie.nomSerie = nouveauNom.trim();
            }
            serie.pochette = nouvellePochette.trim();
            serie.resumeSerie = nouveauResume.trim();
            displayCollection(globalData);
        }

        fetch('collection.json')
            .then(response => response.json())
            .then(data => {
                globalData = data;
                displayCollection(globalData);
            })
            .catch(error => {
                document.getElementById('collection-container').textContent = "Erreur lors du chargement des données.";
                console.error(error);
            });

        document.getElementById('search-btn').addEventListener('click', () => {
            if (!globalData) return;
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            
            if (!query) {
                displayCollection(globalData);
                return;
            }

            const filteredSeries = globalData.series.map(serie => {
                const matchSerie = serie.nomSerie.toLowerCase().includes(query) || (serie.resumeSerie && serie.resumeSerie.toLowerCase().includes(query));
                return matchSerie ? serie : null;
            }).filter(serie => serie !== null);

            displayCollection({ series: filteredSeries });
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            document.getElementById('search-input').value = '';
            displayCollection(globalData);
        });

        document.getElementById('add-serie-btn').addEventListener('click', () => {
            const inputNom = document.getElementById('new-serie-input');
            const inputPochette = document.getElementById('new-pochette-input');
            const inputResume = document.getElementById('new-resume-input');

            const nomSerie = inputNom.value.trim();
            const pochette = inputPochette.value.trim();
            const resumeSerie = inputResume.value.trim();

            if (!nomSerie) {
                alert("Veuillez entrer un nom de série.");
                return;
            }

            const exists = globalData.series.some(s => s.nomSerie.toLowerCase() === nomSerie.toLowerCase());
            if (exists) {
                alert("Cette série existe déjà.");
                return;
            }

            globalData.series.push({
                nomSerie: nomSerie,
                pochette: pochette,
                resumeSerie: resumeSerie
            });

            inputNom.value = '';
            inputPochette.value = '';
            inputResume.value = '';
            displayCollection(globalData);
        });

        document.getElementById('export-btn').addEventListener('click', () => {
            if (!globalData) return;
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(globalData, null, 4));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "collection.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        });
    </script>

</body>
</html>
